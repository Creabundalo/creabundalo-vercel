name: P24 Android Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'actio.html'
      - 'actio.js'
      - 'actio-native.js'
      - 'actio.css'
      - 'watch.js'
      - 'watch.css'
      - '.github/workflows/p24-android-gate.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'actio.html'
      - 'actio.js'
      - 'actio-native.js'
      - 'actio.css'
      - 'watch.js'
      - 'watch.css'
      - '.github/workflows/p24-android-gate.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: JavaScript native bridge syntax
        run: node --check actio-native.js

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload P24 APK
        uses: actions/upload-artifact@v4
        with:
          name: p24-actio-v0.4-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
