name: M24 Pattern E2E

on:
  pull_request:
    paths:
      - 'm24-patterns.js'
      - 'm24-patterns-test.js'
      - 'm24-pattern-matrix-e2e-test.js'
      - 'm24-pattern-discrimination.js'
      - 'm24-pattern-discrimination-e2e-test.js'
      - 'm24-verified-btc-2019.json'
      - 'm24-verified-btc-2021.json'
      - 'm24-verified-eth-2021.json'
      - 'm24-verified-sol-2021.json'
      - 'm24-verified-nasdaq-2000.json'
      - 'm24-lab.js'
      - 'm24-cases.js'
      - 'm24-coinbase.js'
      - 'm24-primary-lab.js'
      - 'm24-fred-market.js'
      - 'm24-index-lab.js'
      - '.github/workflows/m24-pattern-e2e.yml'
  workflow_dispatch:

jobs:
  real-source-patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check m24-patterns.js
          node --check m24-patterns-test.js
          node --check m24-pattern-matrix-e2e-test.js
          node --check m24-pattern-discrimination.js
          node --check m24-pattern-discrimination-e2e-test.js
      - name: Pattern contracts
        run: node m24-patterns-test.js
      - name: Real-source pattern matrix
        run: node m24-pattern-matrix-e2e-test.js
      - name: Pattern discrimination controls
        run: node m24-pattern-discrimination-e2e-test.js
      - name: Upload pattern snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m24-pattern-matrix
          path: |
            m24-pattern-matrix-snapshot.json
            m24-pattern-discrimination-snapshot.json
          if-no-files-found: ignore
