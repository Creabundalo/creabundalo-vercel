name: M24 Source E2E

on:
  pull_request:
    paths:
      - 'm24-source-e2e-test.js'
      - 'm24-index-lab.js'
      - 'm24-fred-market.js'
      - 'm24-nasdaq-2000-source-e2e-test.js'
      - 'm24-nl-housing-source-e2e-test.js'
      - 'm24-global-mar2020-source-e2e-test.js'
      - 'm24-relations.js'
      - 'm24-relations-mar2020-e2e-test.js'
      - 'm24-relation-stability.js'
      - 'm24-relations-regime-stability-e2e-test.js'
      - 'm24-cross-asset-lab.js'
      - 'm24-cbs-housing.js'
      - 'm24-housing-lab.js'
      - 'm24-btc-2019-source-e2e-test.js'
      - 'm24-eth-2021-source-e2e-test.js'
      - 'm24-sol-2021-source-e2e-test.js'
      - 'm24-replay-e2e-test.js'
      - 'm24-horizon-profile-e2e-test.js'
      - 'm24-episode-generator.js'
      - 'm24-episode-generator-e2e-test.js'
      - 'm24-generated-case.js'
      - 'm24-generated-case-e2e-test.js'
      - 'm24-generated-replay-e2e-test.js'
      - 'm24-verified-generated-eth-2023-02-16.json'
      - 'm24-verified-nl-housing-2015-2023.json'
      - 'm24-verified-global-mar2020.json'
      - 'm24-verified-btc-2019.json'
      - 'm24-verified-btc-2021.json'
      - 'm24-verified-eth-2021.json'
      - 'm24-verified-sol-2021.json'
      - 'm24-replay.js'
      - 'm24-calibration.js'
      - 'm24-enrichment.js'
      - 'm24-evidence-gate.js'
      - 'm24-coinbase.js'
      - 'm24-derivatives.js'
      - 'm24-derivatives-lab.js'
      - 'm24-cftc.js'
      - 'm24-cftc-lab.js'
      - 'm24-binance-vision.js'
      - 'm24-funding-archive.js'
      - 'm24-binance-vision-lab.js'
      - 'm24-macro.js'
      - 'm24-macro-lab.js'
      - 'm24-meaning.js'
      - 'm24-backtest.js'
      - '.github/workflows/m24-source-e2e.yml'
  workflow_dispatch:

jobs:
  historical-real-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check m24-source-e2e-test.js
          node --check m24-nasdaq-2000-source-e2e-test.js
          node --check m24-nl-housing-source-e2e-test.js
          node --check m24-global-mar2020-source-e2e-test.js
          node --check m24-relations.js
          node --check m24-relations-mar2020-e2e-test.js
          node --check m24-relations-regime-stability-e2e-test.js
          node --check m24-cross-asset-lab.js
          node --check m24-cbs-housing.js
          node --check m24-housing-lab.js
          node --check m24-fred-market.js
          node --check m24-index-lab.js
          node --check m24-btc-2019-source-e2e-test.js
          node --check m24-cftc.js
          node --check m24-cftc-lab.js
          node --check m24-eth-2021-source-e2e-test.js
          node --check m24-sol-2021-source-e2e-test.js
          node --check m24-replay-e2e-test.js
          node --check m24-horizon-profile-e2e-test.js
          node --check m24-episode-generator.js
          node --check m24-episode-generator-e2e-test.js
          node --check m24-generated-case.js
          node --check m24-generated-case-e2e-test.js
          node --check m24-generated-replay-e2e-test.js
      - name: March 2020 relation stability
        run: node m24-relations-regime-stability-e2e-test.js
      - name: March 2020 cross-asset relation discovery
        run: node m24-relations-mar2020-e2e-test.js
      - name: GLOBAL March 2020 real-source enrichment
        run: node m24-global-mar2020-source-e2e-test.js
      - name: NL housing 2015-2023 real-source enrichment
        run: node m24-nl-housing-source-e2e-test.js
      - name: NASDAQ 1999-2002 real-source enrichment
        run: node m24-nasdaq-2000-source-e2e-test.js
      - name: BTC 2019 real-source enrichment
        run: node m24-btc-2019-source-e2e-test.js
      - name: BTC 2021 real-source enrichment
        run: node m24-source-e2e-test.js
      - name: ETH 2021 real-source enrichment
        run: node m24-eth-2021-source-e2e-test.js
      - name: SOL 2021 real-source enrichment
        run: node m24-sol-2021-source-e2e-test.js
      - name: Rolling fast-market episode candidate scan
        run: node m24-episode-generator-e2e-test.js
      - name: Generated mechanics-core source enrichment
        run: node m24-generated-case-e2e-test.js
      - name: Generated mechanics-core horizon replay
        run: node m24-generated-replay-e2e-test.js
      - name: Market-specific horizon profile validation
        run: node m24-horizon-profile-e2e-test.js
      - name: BTC + ETH + SOL verified horizon replay
        run: node m24-replay-e2e-test.js
      - name: Upload source snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m24-2021-source-snapshots
          path: |
            m24-generated-mechanics-core-snapshot.json
            m24-generated-mechanics-core-replay-snapshot.json
            m24-episode-candidate-scan.json
            m24-horizon-profile-validation-snapshot.json
            m24-relations-mar2020-snapshot.json
            m24-relations-regime-stability-snapshot.json
            m24-global-mar2020-source-snapshot.json
            m24-nl-housing-source-snapshot.json
            m24-nasdaq-2000-source-snapshot.json
            m24-btc-2019-source-snapshot.json
            m24-btc-2019-replay-snapshot.json
            m24-btc-2021-source-snapshot.json
            m24-btc-2021-replay-snapshot.json
            m24-eth-2021-source-snapshot.json
            m24-eth-2021-replay-snapshot.json
            m24-sol-2021-source-snapshot.json
            m24-sol-2021-replay-snapshot.json
            m24-replay-failure.json
          if-no-files-found: ignore
