plugins {
    id 'com.android.application'
}

android {
    namespace 'com.creabundalo.p24'
    compileSdk 35

    defaultConfig {
        applicationId 'com.creabundalo.p24'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ["$buildDir/generated/actioAssets"]
        }
    }
}

def repoRoot = rootProject.projectDir.parentFile
def generatedAssets = file("$buildDir/generated/actioAssets")

tasks.register('syncActioAssets', Copy) {
    from(repoRoot) {
        include 'actio.html'
        include 'actio.css'
        include 'actio.js'
        include 'actio-native.js'
        include 'actio-icon.svg'
        include 'watch.css'
        include 'watch.js'
    }
    into(generatedAssets)
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('syncActioAssets')
}
